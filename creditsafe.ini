; Parametres de creditsafe.exe
; (les commentaires commencent par ; en debut de ligne)

[GENERAL]
; dossier des fichiers (utilise quand le nom de fichier n'a pas de chemin)
DOSSIER=\source\creditsafe
; fichier des debiteurs a mettre en surveillance
FICHIER_DEBITEURS=DebSiren.dbf
; trace des mises en surveillance (cree automatiquement)
FICHIER_SUIVI=CsSuivi.dbf
; alertes recuperees (cree automatiquement)
FICHIER_ALERTES=CsAlertes.dbf
FICHIER_LOG=creditsafe.log
; codepage du programme (console, log, echanges API)
CODEPAGE=FRWIN
; codepage des fichiers DBF (lecture DebSiren et ecriture CsSuivi / CsAlertes)
CODEPAGE_DBF=FR850
; 1 = interroge Creditsafe mais ne cree ni portefeuille ni surveillance
SIMULATION=1
; 0 = pas de limite (mettre 10 pour un premier essai)
MAX_DEBITEURS=0

[CHAMPS]
; noms des champs dans FICHIER_DEBITEURS (SIREN ou SIRET accepte)
SIREN=SIREN
CA=CA
CODERELA=CODERELA
NOM=NOM
; expression Harbour optionnelle pour ne garder que les professionnels, ex : TYPEDEB=="P"
FILTRE=
; controle de la cle de Luhn du SIREN
CONTROLE_LUHN=1

[API]
; SANDBOX ou LIVE
ENVIRONNEMENT=SANDBOX
URL_LIVE=https://connect.creditsafe.com/v1
URL_SANDBOX=https://connect.sandbox.creditsafe.com/v1
; identifiants : ici, ou mieux dans les variables CREDITSAFE_USER / CREDITSAFE_PASSWORD
UTILISATEUR=
MOT_DE_PASSE=
; pause entre deux debiteurs (millisecondes)
PAUSE_MS=250
TIMEOUT_S=60

[PORTEFEUILLE]
; nom du portefeuille = PREFIXE_NOM + 2 premieres lettres de CA (ou CODERELA)
PREFIXE_NOM=DEBITEURS-
; serie utilisee si CA et CODERELA sont vides
SERIE_PAR_DEFAUT=ZZ
; adresses e-mail recevant les alertes Creditsafe (separees par ;)
EMAILS=
; id d'un portefeuille dont on copie les regles d'alerte vers chaque nouveau portefeuille
PORTEFEUILLE_MODELE_REGLES=
PAYS_REGLES=FR

[ALERTES]
; profondeur de recherche des alertes (jours)
JOURS=30
SEULEMENT_NON_TRAITEES=1
; 1 = marque les alertes comme traitees chez Creditsafe apres import
MARQUER_TRAITEES=0
